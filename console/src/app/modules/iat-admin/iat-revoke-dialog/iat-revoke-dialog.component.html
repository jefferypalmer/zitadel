<h2 mat-dialog-title>{{ 'DESCRIPTIONS.DCR.IAT.REVOKE_BUTTON' | translate }}</h2>
<mat-dialog-content>
  <p>{{ 'DESCRIPTIONS.DCR.IAT.REVOKE_CONFIRM' | translate }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" data-e2e="iat-revoke-cancel" (click)="cancel()">
    {{ 'ACTIONS.CANCEL' | translate }}
  </button>
  <button mat-raised-button color="warn" type="button" data-e2e="iat-revoke-confirm" (click)="confirm()">
    {{ 'DESCRIPTIONS.DCR.IAT.REVOKE_BUTTON' | translate }}
  </button>
</mat-dialog-actions>
